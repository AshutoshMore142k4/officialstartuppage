<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="alternate icon" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!--
      color-scheme opts out of Chrome for Android's "Auto dark theme", which
      force-inverts pages that don't declare one. Must be here (and in CSS)
      rather than set by JS, which runs too late to influence the decision.
    -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />

    <!--
      Applies the stored theme before first paint. next-themes ships an
      equivalent script, but React inserts it into an already-parsed document
      and injected <script> tags never execute — so in a Vite SPA (unlike
      Next.js) the theme would otherwise only apply after JS boots, causing a
      flash of the wrong theme on every load.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme = stored === 'dark' || stored === 'light' ? stored : 'light';
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(theme);
          root.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#0a0a0a' : '#ffffff');
        } catch (e) {
          document.documentElement.classList.add('light');
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>

    <meta name="author" content="11Startups" />

    <!-- LLM Discoverability -->
    <link rel="alternate" type="text/plain" href="/llms.txt" title="LLM summary" />
    <link rel="alternate" type="text/plain" href="/llms-full.txt" title="LLM full context" />

    <!-- Per-page title, description, canonical, Open Graph and JSON-LD come from SEOHead (src/components/SEOHead.tsx);
         scripts/prerender.mjs injects them at the marker below at build time. -->
    <!--app-head-->
  </head>

  <body>
    <div id="root"><!--app-html--></div>
    <noscript>
      <p>11Startups is an applied AI company building language models and developer tools. Please enable JavaScript to view this site, or email us at founder.ashutoshm@11startups.tech.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
